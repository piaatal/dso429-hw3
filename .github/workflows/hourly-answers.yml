name: Answer quiz rounds

# Rounds drop at the top of each hour; full credit lasts three hours.
# GitHub gives no delivery guarantee for scheduled workflows and drops or
# delays them under load, so this runs at the 5-minute minimum: ~36 chances
# inside each round's full-credit window instead of 12. Runs are ~10s and
# public-repo minutes are free, and a run with nothing to do commits nothing.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: answer-rounds
  cancel-in-progress: false

jobs:
  answer:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # continue-on-error so a fallback answer still gets committed below;
      # the run is failed at the end instead, after the push.
      - name: Solve unanswered rounds
        id: solve
        continue-on-error: true
        working-directory: tools
        run: |
          # Without pipefail the pipeline reports tee's status and
          # submit.py's exit code 1 is swallowed, killing the alert.
          set -o pipefail
          python3 submit.py | tee -a "$GITHUB_STEP_SUMMARY"

      # Dead man's switch. The chain is what actually answers rounds on time;
      # if it dies quietly (cancelled run, dead runner) nothing fails, so no
      # email is sent and submissions just stop. This fires rarely -- the
      # scheduler only delivers ~every 4h -- but a failed run here emails,
      # which is the only thing that reaches the user when they are away.
      - name: Dead man's switch - is the chain still alive?
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          started=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/chain.yml/runs?per_page=1" \
            | python3 -c "
import json,sys
try:
    rs = json.load(sys.stdin)['workflow_runs']
    print(rs[0]['run_started_at'] if rs else '')
except Exception:
    print('')")
          if [ -z "$started" ]; then
            echo "::error::No Answer chain run found at all - the chain is not running. Open Actions -> Answer chain -> Run workflow."
            exit 1
          fi
          age=$(python3 -c "
import datetime,sys
t=datetime.datetime.fromisoformat('$started'.replace('Z','+00:00'))
print(int((datetime.datetime.now(datetime.timezone.utc)-t).total_seconds()//60))")
          echo "newest chain run started $age minutes ago"
          # Hand-offs are ~330 min apart; 420 allows a late one without crying wolf.
          if [ "$age" -gt 420 ]; then
            echo "::error::The Answer chain has not started a run in $age minutes - it has stopped. Open Actions -> Answer chain -> Run workflow to restart it."
            exit 1
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -z "$(git status --porcelain answers meta)" ]; then
            echo "no new answers to commit"
            exit 0
          fi
          git add answers meta
          git commit -m "Answer rounds ($(date -u +%Y-%m-%dT%H:%MZ))"
          for attempt in 1 2 3; do
            if git push; then
              echo "pushed on attempt $attempt"
              exit 0
            fi
            echo "push failed, rebasing and retrying"
            git pull --rebase --autostash
            sleep 5
          done
          echo "::error::could not push answers after 3 attempts"
          exit 1

      # Runs last, so answers are always on GitHub before the run goes red.
      - name: Alert if any question needed a fallback
        if: steps.solve.outcome == 'failure'
        run: |
          echo "::error::A question fell through to a fallback answer - the \
          generator may have introduced an unrecognized template. Check the \
          solve step output and add a solver family."
          exit 1
